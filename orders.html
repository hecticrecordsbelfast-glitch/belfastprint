<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Orders — Belfast Print</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
<style>
  .staff-wrap { max-width: 960px; margin: 0 auto; padding: 48px 24px 96px; }
  .login-box { max-width: 360px; margin: 120px auto; text-align: center; }
  .login-box input { width: 100%; margin: 16px 0; }
  .staff-header { display:flex; justify-content:space-between; align-items:center; margin-bottom: 24px; }
  .staff-header a { font-size: 14px; text-decoration: underline; }
  .order-card { border: 2px solid var(--ink); border-radius: var(--radius); padding: 18px; margin-bottom: 16px; display: grid; grid-template-columns: 160px 1fr; gap: 20px; }
  .order-card .previews { display: flex; gap: 8px; }
  .order-card .previews img { width: 72px; height: 90px; object-fit: contain; border: 1px solid var(--line); background: #fff; }
  .order-meta { font-size: 13.5px; line-height: 1.6; }
  .order-meta strong { font-weight: 700; }
  .fulfil-toggle { margin-top: 10px; font-size: 13px; display:flex; align-items:center; gap:8px; }
  @media (max-width: 600px) { .order-card { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<div id="loginView" class="login-box">
  <h1>Staff login</h1>
  <input type="password" id="passwordInput" placeholder="Admin password" />
  <button class="submit-btn" id="loginBtn" style="width:100%;">Log in</button>
  <p class="form-status is-error" id="loginError"></p>
</div>

<div id="appView" class="staff-wrap" hidden>
  <div class="staff-header">
    <h1 style="font-size:22px;">Orders</h1>
    <a href="admin.html">Stock →</a>
  </div>
  <div id="ordersList"></div>
</div>

<script>
(function () {
  "use strict";
  let adminPassword = "";

  document.getElementById("loginBtn").addEventListener("click", attemptLogin);
  document.getElementById("passwordInput").addEventListener("keydown", (e) => {
    if (e.key === "Enter") attemptLogin();
  });

  async function attemptLogin() {
    adminPassword = document.getElementById("passwordInput").value;
    sessionStorage.setItem("bp_admin_pw", adminPassword);
    await loadOrders();
  }

  async function loadOrders() {
    try {
      const res = await fetch("/api/orders", { headers: { "X-Admin-Password": adminPassword } });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Could not load orders");
      renderOrders(data.orders || []);
      document.getElementById("loginView").hidden = true;
      document.getElementById("appView").hidden = false;
    } catch (e) {
      document.getElementById("loginError").textContent = e.message;
    }
  }

  function renderOrders(orders) {
    const wrap = document.getElementById("ordersList");
    wrap.innerHTML = "";
    if (!orders.length) {
      wrap.innerHTML = "<p>No orders yet.</p>";
      return;
    }
    orders.forEach((o) => {
      const card = document.createElement("div");
      card.className = "order-card";
      card.innerHTML = `
        <div class="previews">
          ${o.frontPreview ? `<img src="${o.frontPreview}" alt="Front" />` : ""}
          ${o.backPreview ? `<img src="${o.backPreview}" alt="Back" />` : ""}
        </div>
        <div>
          <div class="order-meta">
            <strong>${o.size}, ${o.colorName}</strong> — ${o.printLocation === "front-back" ? "Front & back" : "Front only"}, ${o.printMethod === "dtg" ? "DTG" : "Film transfer"}<br/>
            <strong>Fulfilment:</strong> ${o.fulfillment === "shipping" ? "Ship to customer" : "Collect in store"}<br/>
            <strong>Buyer:</strong> ${o.buyerName || "—"} (${o.buyerEmail || "—"}) ${o.buyerPhone || ""}<br/>
            ${o.shippingAddress ? `<strong>Address:</strong> ${o.shippingAddress}<br/>` : ""}
            <strong>Order ID:</strong> ${o.orderId}
          </div>
          <label class="fulfil-toggle">
            <input type="checkbox" ${o.fulfilled ? "checked" : ""} data-order="${o.orderId}" />
            Mark as fulfilled
          </label>
        </div>
      `;
      card.querySelector("input[type=checkbox]").addEventListener("change", async (e) => {
        await fetch("/api/orders/update", {
          method: "POST",
          headers: { "Content-Type": "application/json", "X-Admin-Password": adminPassword },
          body: JSON.stringify({ orderId: e.target.dataset.order, fulfilled: e.target.checked }),
        });
      });
      wrap.appendChild(card);
    });
  }

  const stored = sessionStorage.getItem("bp_admin_pw");
  if (stored) {
    adminPassword = stored;
    loadOrders();
  }
})();
</script>

</body>
</html>
